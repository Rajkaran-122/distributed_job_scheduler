<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background-color: #080A0F; font-family: Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Simple clean arrow marker in blue -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <!-- Simple clean dashed arrow marker -->
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Title & Scope -->
  <text x="60" y="55" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="-0.02em">High-Level Design (HLD) — System Topology</text>
  <text x="60" y="82" fill="#94A3B8" font-size="13">End-to-end communication paths across clients, gateway, control plane, and data layers</text>

  <!-- Grid Boundary Outer Box -->
  <rect x="60" y="110" width="1080" height="520" rx="10" fill="#0D1117" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subgraph 1: Client Ingress -->
  <g transform="translate(100, 150)">
    <rect width="240" height="110" rx="8" fill="#131924" stroke="#2563EB" stroke-width="1.5" />
    <text x="24" y="38" fill="#FFFFFF" font-size="15" font-weight="600">Web Browser Client</text>
    <text x="24" y="62" fill="#94A3B8" font-size="12">Vite React SPA Frontend</text>
    <text x="24" y="84" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11">REST API &amp; STOMP WS</text>
  </g>

  <!-- Arrow: Client -> Nginx -->
  <line x1="340" y1="205" x2="440" y2="205" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390" y="195" fill="#94A3B8" font-size="11" text-anchor="middle" font-family="'JetBrains Mono', monospace">HTTPS / WSS</text>

  <!-- Subgraph 2: Edge Gateway -->
  <g transform="translate(450, 150)">
    <rect width="280" height="110" rx="8" fill="#131924" stroke="#2563EB" stroke-width="1.5" />
    <text x="24" y="38" fill="#FFFFFF" font-size="15" font-weight="600">Nginx API Gateway</text>
    <text x="24" y="62" fill="#94A3B8" font-size="12">Reverse Proxy &amp; SSL Ingress</text>
    <text x="24" y="84" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11">Port 80 / 443 · Rate Limits</text>
  </g>

  <!-- Arrow: Nginx -> Spring Boot -->
  <line x1="590" y1="260" x2="590" y2="340" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="305" fill="#94A3B8" font-size="11" font-family="'JetBrains Mono', monospace">Proxy Pass</text>

  <!-- Subgraph 3: Core Application Engine -->
  <g transform="translate(420, 350)">
    <rect width="340" height="120" rx="8" fill="#131924" stroke="#3B82F6" stroke-width="2" />
    <text x="24" y="36" fill="#FFFFFF" font-size="16" font-weight="700">Spring Boot Core Engine</text>
    <text x="24" y="60" fill="#94A3B8" font-size="12">Java 21 · Distributed Scheduler Service</text>
    <text x="24" y="82" fill="#94A3B8" font-size="12">Dispatcher Leader Elector &amp; Lease Reaper</text>
    <text x="24" y="102" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11">Actuator Metrics · STOMP Broker</text>
  </g>

  <!-- Subgraph 4: PostgreSQL Database -->
  <g transform="translate(160, 490)">
    <rect width="250" height="110" rx="8" fill="#131924" stroke="#1E293B" stroke-width="1.5" />
    <text x="24" y="36" fill="#FFFFFF" font-size="15" font-weight="600">PostgreSQL 16</text>
    <text x="24" y="60" fill="#94A3B8" font-size="12">Durable ACID Job Queue</text>
    <text x="24" y="82" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11">FOR UPDATE SKIP LOCKED</text>
  </g>

  <!-- Arrow: Spring Boot <-> PostgreSQL -->
  <path d="M 440 470 L 440 545 L 410 545" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="445" y="520" fill="#94A3B8" font-size="11" font-family="'JetBrains Mono', monospace">JDBC / JPA</text>

  <!-- Subgraph 5: Redis Cache & Ephemeral Engine -->
  <g transform="translate(770, 490)">
    <rect width="250" height="110" rx="8" fill="#131924" stroke="#1E293B" stroke-width="1.5" />
    <text x="24" y="36" fill="#FFFFFF" font-size="15" font-weight="600">Redis Memory Store</text>
    <text x="24" y="60" fill="#94A3B8" font-size="12">Lettuce Client Driver</text>
    <text x="24" y="82" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11">BLPOP · Heartbeats · Pub/Sub</text>
  </g>

  <!-- Arrow: Spring Boot <-> Redis -->
  <path d="M 740 470 L 740 545 L 770 545" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="670" y="520" fill="#94A3B8" font-size="11" font-family="'JetBrains Mono', monospace">Lettuce Pool</text>

  <!-- Subgraph 6: Observability (Right side) -->
  <g transform="translate(850, 150)">
    <rect width="250" height="230" rx="8" fill="#101520" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="20" y="32" fill="#94A3B8" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="0.05em">Observability Stack</text>

    <!-- Prometheus block -->
    <rect x="20" y="50" width="210" height="65" rx="6" fill="#131924" stroke="#2563EB" stroke-width="1" />
    <text x="32" y="76" fill="#FFFFFF" font-size="13" font-weight="600">Prometheus</text>
    <text x="32" y="96" fill="#94A3B8" font-size="11">Scrapes /actuator/prometheus</text>

    <!-- Grafana block -->
    <rect x="20" y="135" width="210" height="65" rx="6" fill="#131924" stroke="#2563EB" stroke-width="1" />
    <text x="32" y="161" fill="#FFFFFF" font-size="13" font-weight="600">Grafana Dashboard</text>
    <text x="32" y="181" fill="#94A3B8" font-size="11">Throughput, Latency, Workers</text>
  </g>

  <!-- Arrow: Spring Boot -> Prometheus -->
  <path d="M 760 390 L 850 250" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="815" y="335" fill="#64748B" font-size="10" font-family="'JetBrains Mono', monospace">Metrics</text>
</svg>
