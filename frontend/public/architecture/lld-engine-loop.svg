<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background-color: #080A0F; font-family: Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Simple clean blue arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <!-- Muted arrow marker -->
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Title & Scope -->
  <text x="60" y="55" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="-0.02em">Low-Level Design (LLD) — Execution Loop</text>
  <text x="60" y="82" fill="#94A3B8" font-size="13">Zero-contention queue claiming, transactional dispatch hooks, jittered retries, and lease consensus</text>

  <!-- Main Architecture Container -->
  <rect x="60" y="110" width="1080" height="540" rx="10" fill="#0D1117" stroke="#1E293B" stroke-width="1.5" />

  <!-- Module 1: JobRepository (SKIP LOCKED) -->
  <g transform="translate(100, 150)">
    <rect width="320" height="150" rx="8" fill="#131924" stroke="#2563EB" stroke-width="1.5" />
    <text x="20" y="34" fill="#FFFFFF" font-size="15" font-weight="700">1. JobRepository</text>
    <text x="20" y="56" fill="#94A3B8" font-size="12">PostgreSQL Atomic Row Claiming</text>
    <rect x="15" y="72" width="290" height="64" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="92" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10.5">SELECT id FROM jobs WHERE ...</text>
    <text x="25" y="110" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">FOR UPDATE SKIP LOCKED</text>
    <text x="25" y="126" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">LIMIT :batchSize</text>
  </g>

  <!-- Module 2: DispatcherLeaderElector -->
  <g transform="translate(480, 150)">
    <rect width="300" height="150" rx="8" fill="#131924" stroke="#1E293B" stroke-width="1.5" />
    <text x="20" y="34" fill="#FFFFFF" font-size="15" font-weight="700">2. DispatcherLeaderElector</text>
    <text x="20" y="56" fill="#94A3B8" font-size="12">Redis Lock Consensus Coordinator</text>
    <rect x="15" y="72" width="270" height="64" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="92" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10.5">acquireLeadership()</text>
    <text x="25" y="110" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10.5">SET key token NX EX 10</text>
    <text x="25" y="126" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Single-leader execution lock</text>
  </g>

  <!-- Module 3: Distributed Worker Nodes (Right) -->
  <g transform="translate(840, 150)">
    <rect width="260" height="300" rx="8" fill="#131924" stroke="#2563EB" stroke-width="1.5" />
    <text x="20" y="34" fill="#FFFFFF" font-size="15" font-weight="700">Distributed Workers</text>
    <text x="20" y="56" fill="#94A3B8" font-size="12">Horizontal Fleet (N Replicas)</text>

    <!-- Worker A -->
    <rect x="15" y="75" width="230" height="60" rx="6" fill="#0D1117" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="98" fill="#FFFFFF" font-size="12" font-weight="600">Worker Instance 1</text>
    <text x="25" y="120" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11">BLPOP queue:default</text>

    <!-- Worker B -->
    <rect x="15" y="145" width="230" height="60" rx="6" fill="#0D1117" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="168" fill="#FFFFFF" font-size="12" font-weight="600">Worker Instance 2</text>
    <text x="25" y="190" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11">Emits Lease Heartbeat</text>

    <!-- Worker C -->
    <rect x="15" y="215" width="230" height="60" rx="6" fill="#0D1117" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="238" fill="#FFFFFF" font-size="12" font-weight="600">Worker Instance N</text>
    <text x="25" y="260" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Idempotent Execution</text>
  </g>

  <!-- Module 4: JobDispatchService (Center Bottom) -->
  <g transform="translate(480, 350)">
    <rect width="300" height="140" rx="8" fill="#131924" stroke="#2563EB" stroke-width="2" />
    <text x="20" y="34" fill="#FFFFFF" font-size="15" font-weight="700">3. JobDispatchService</text>
    <text x="20" y="56" fill="#94A3B8" font-size="12">Transactional Coordinator</text>
    <rect x="15" y="70" width="270" height="55" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="92" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10.5">@Transactional</text>
    <text x="25" y="110" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10.5">afterCommit() -> Redis</text>
  </g>

  <!-- Module 5: RetryPolicyCalculator (Bottom Left) -->
  <g transform="translate(100, 480)">
    <rect width="320" height="130" rx="8" fill="#131924" stroke="#1E293B" stroke-width="1.5" />
    <text x="20" y="32" fill="#FFFFFF" font-size="14" font-weight="700">4. RetryPolicyCalculator</text>
    <text x="20" y="52" fill="#94A3B8" font-size="12">Exponential Backoff with Full Jitter</text>
    <rect x="15" y="65" width="290" height="50" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="85" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10.5">delay = rand(0, base * 2^attempt)</text>
    <text x="25" y="102" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">De-synchronizes thundering herds</text>
  </g>

  <!-- Module 6: LeaseReaperService (Bottom Right) -->
  <g transform="translate(840, 480)">
    <rect width="260" height="130" rx="8" fill="#131924" stroke="#1E293B" stroke-width="1.5" />
    <text x="20" y="32" fill="#FFFFFF" font-size="14" font-weight="700">5. LeaseReaperService</text>
    <text x="20" y="52" fill="#94A3B8" font-size="12">Autonomous Crash Salvage</text>
    <rect x="15" y="65" width="230" height="50" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="85" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10.5">@Scheduled(delay = 5s)</text>
    <text x="25" y="102" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Reclaims dead worker leases</text>
  </g>

  <!-- Connecting Arrows -->
  <!-- 1 -> 3 -->
  <path d="M 420 225 L 450 225 L 450 420 L 480 420" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="455" y="320" fill="#94A3B8" font-size="10.5" font-family="'JetBrains Mono', monospace">Claims</text>

  <!-- 2 -> 3 -->
  <line x1="630" y1="300" x2="630" y2="350" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="640" y="330" fill="#94A3B8" font-size="10.5" font-family="'JetBrains Mono', monospace">Elected</text>

  <!-- 3 -> Workers -->
  <line x1="780" y1="420" x2="840" y2="420" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="800" y="410" fill="#94A3B8" font-size="10.5" font-family="'JetBrains Mono', monospace">Dispatch</text>

  <!-- 3 -> 4 (Retry) -->
  <path d="M 480 440 L 440 440 L 440 530 L 420 530" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="430" y="490" fill="#64748B" font-size="10.5" font-family="'JetBrains Mono', monospace">Failures</text>

  <!-- 6 (Reaper) -> 1 (Reclaim) -->
  <path d="M 840 545 L 750 545 L 750 560 L 420 560" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="650" y="555" fill="#64748B" font-size="10.5" font-family="'JetBrains Mono', monospace">Resets expired to PENDING</text>
</svg>
