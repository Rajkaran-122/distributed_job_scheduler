worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - $request_time - "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # React SPA build, served by the frontend container's own nginx.
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # REST API
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /swagger-ui/ {
            proxy_pass http://backend_upstream/swagger-ui/;
        }
        location = /swagger-ui.html {
            proxy_pass http://backend_upstream/swagger-ui.html;
        }
        location /v3/api-docs {
            proxy_pass http://backend_upstream/v3/api-docs;
        }

        # WebSocket (live dashboard updates)
        location /ws/ {
            proxy_pass http://backend_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /actuator/health {
            proxy_pass http://backend_upstream/actuator/health;
        }
    }
}
